[Unit]
After=systemd-tmpfiles-setup.service miro-ego-data-volume.service

[Service]
Type=exec
ExecStart=
ExecStart=/usr/local/sbin/miro-ego-idle-fstrim
# A busy recorder must defer maintenance, not lose the weekly trim entirely.
Restart=on-failure
RestartPreventExitStatus=1
RestartSec=15min
TimeoutStartSec=10min
RuntimeMaxSec=10min
