[package]
name = "rp-ylx-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
libloading = "0.8.9"
libc = "0.2.189"
pyo3 = { version = "0.25.1", features = ["abi3-py311"] }
sha2 = "0.10.9"
