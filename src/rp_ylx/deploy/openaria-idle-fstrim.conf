[Unit]
After=systemd-tmpfiles-setup.service rp-ylx-data-volume.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/rp-ylx-idle-fstrim
# A busy recorder must defer maintenance, not lose the weekly trim entirely.
Restart=on-failure
RestartPreventExitStatus=1
RestartSec=15min
TimeoutStartSec=10min
