openapi: 3.1.0
info:
  title: YLX 设备 API
  version: 3.0.0
  summary: 用于 YLX 0.5 设备控制和已完成会话传输的目标 HTTP 契约
  description: |
    这是目标契约，并不表示已有对应实现。

    采集 daemon 始终是权威状态机。启动和停止均为幂等命令，已完成会话不可变，
    artifact 字节服务支持字节范围请求和 HEAD。
servers:
  - url: https://{device_host}/api/v3
    description: 通过 AP、以太网或显式配置的 LAN 访问的设备
    variables:
      device_host:
        default: 10.42.0.1
        description: 设备的 IP 地址或 mDNS 主机名
tags:
  - name: Device
  - name: Capture
  - name: Sessions
x-ylx-security-profiles:
  customer:
    authentication: bearer
    standard_openapi_security: bearer-only-authority
    description: 每个操作都需要客户签发的 bearer token。
    destructive_mutation: not-enabled
    network_mutation: not-enabled
  lab:
    authentication: none
    standard_openapi_resolution: explicit-lab-profile-artifact-required
    deployment_constraint: isolated-device-only
    description: |
      仅在显式选定且物理隔离的实验室部署中，所列操作才无需身份验证。标准 OpenAPI
      security 条款对 Customer 仍保持仅限 bearer 且具权威性；Lab 部署需要独立解析的
      不可变 profile artifact，并在运行时精确验证下列获准的 operation ID。此 profile
      不路由破坏性变更或网络变更；任何实现私有的匹配路由都必须在到达 handler 前以
      403 拒绝。
    allowed_operation_ids:
      - getDevice
      - getCaptureStatus
      - startCapture
      - stopCapture
      - streamCaptureEvents
      - getCurrentSafeSwapReceipt
      - getPreview
      - listSessions
      - getSession
      - getRetainedUnsuccessfulSessionOutcome
      - getSessionArtifact
      - headSessionArtifact
    destructive_mutation: unreachable-or-403
    network_mutation: unreachable-or-403
paths:
  /device:
    get:
      tags: [Device]
      operationId: getDevice
      summary: 读取设备标识、软件、存储和声明的能力
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 设备描述信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDescriptor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /capture/status:
    get:
      tags: [Capture]
      operationId: getCaptureStatus
      summary: 读取当前由 daemon 权威确定的采集快照
      description: |
        返回当前 daemon 权威标识，以及与 snapshot 类型 CaptureEvent 使用的相同闭合快照
        payload。source_revision 是该快照的 daemon journal 修订号，绝不是 SSE 投递 ID。
        空闲快照可以保留最近一次未成功的终止结果，即使之后已有新的成功会话；历史结果仍可
        按会话查询。没有保留结果的普通空闲状态仍返回 200 快照，其中 active_recording 和
        retained_unsuccessful 均为 null，runtime 仍然存在。
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前带权威信息的采集快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureStatusSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /capture/start:
    post:
      tags: [Capture]
      operationId: startCapture
      summary: 幂等地启动或加入当前采集命令
      description: |
        daemon 在接受采集前分配标识符。重复相同请求会收敛到同一个活动录制。使用相同
        请求重放 Idempotency-Key 会返回原始响应；以不同请求数据复用该键则返回 409。
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureStartRequest"
      responses:
        "202":
          description: 已接受采集命令；响应为当前带权威信息的 daemon 快照
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureStatusSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /capture/stop:
    post:
      tags: [Capture]
      operationId: stopCapture
      summary: 幂等地请求最终化采集
      description: |
        重复停止不会产生第二次最终化。客户端可以通过 status/SSE 跟踪 finalizing
        或 verifying，直至形成已密封会话。设备不存在后台编码态：成片在录制期间边录边出。没有活动会话时，停止是幂等的空操作并返回 204。
        recoverable、failed 和 abandoned 是终止结果：它们绝不会进入已完成会话列表，
        客户端会呈现诊断信息。此 API 版本不定义抢救操作；未来的任何恢复流程都需要独立的
        版本化恢复契约和 API 操作。reason=safe_swap 是请求意图；只有随后通过 SSE 投递，
        或从 /capture/safe-swap 逐字段恢复的类型化 safe_swap 回执，才能证明持久密封和卷释放。
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureStopRequest"
      responses:
        "202":
          description: 已接受停止/最终化命令；响应为当前带权威信息的 daemon 快照
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureStatusSnapshot"
        "204":
          description: 没有活动会话；幂等停止是成功的空操作
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /capture/events:
    get:
      tags: [Capture]
      operationId: streamCaptureEvents
      summary: 通过 SSE 流式传输 daemon 状态变更
      description: |
        SSE id 值与 CaptureEvent.sse_delivery_id 是同一个十进制传输投递序列。客户端使用
        Last-Event-ID 重连；当请求的投递 ID 已不在有限重放缓冲区内时，服务器首先发出快照。
        每个非 heartbeat 事件分别保留由 daemon 权威确定的 authority_epoch 和 source_revision；
        gateway 绝不会替换、重新编号、排序或去重这些源字段。事件名称为 snapshot、state、
        progress、diagnostic、safe_swap 和 heartbeat。每个非 heartbeat 的 data 字段都是一个
        紧凑 JSON CaptureEvent。新的生产 safe_swap 数据使用最小化的 v3 交接回执；旧 v2
        回执仅通过冻结的 /api/v2 读取。如果 safe_swap 事件已离开有限重放缓冲区，客户端可通过
        GET /capture/safe-swap 恢复完全相同的类型化回执。heartbeat 是 SSE 注释，不推进投递
        修订号或源修订号。
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      x-sse-data-schema:
        $ref: "#/components/schemas/CaptureEvent"
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: 打开 SSE 流；使用最近处理的 id 字段重连
          headers:
            Cache-Control:
              description: SSE 响应绝不缓存
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              description: 反向代理不得缓冲该流
              schema:
                type: string
                const: "no"
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1042
                event: state
                data: {"schema":"ylx.capture-event.v3","sse_delivery_id":"1042","authority_epoch":"4fa85f64-5717-4562-b3fc-2c963f66afa6","source_revision":42,"type":"state","occurred_at":"2026-08-08T02:25:01Z","session_id":"01989f6a-2c00-7a1b-8c2d-3e4f50617283","data":{"schema":"ylx.capture-state-event.v2","state":"finalizing","volume_id":"6ba7b810-9dad-41d1-80b4-00c04fd430c8","generation_id":"7d516b70-d8ab-47d1-b2dc-5b1250138789"}}

        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /capture/safe-swap:
    get:
      tags: [Capture]
      operationId: getCurrentSafeSwapReceipt
      summary: 恢复当前成功的 safe-swap 交接回执
      description: |
        返回先前在成功的 safe_swap CaptureEvent 中发出的同一份最小 v3 类型化回执。旧 v2
        回执仅通过冻结的 /api/v2 读取，不会投影到此资源。此资源独立于 Recording State，且
        不会因 SSE 重放缓冲区淘汰而消失。仅当它仍描述同一个已释放的挂载代次和会话时，daemon
        才会跨重启保留它。在准入不同的卷、挂载代次或会话前，daemon 必须以原子方式使该资源
        失效；重新挂载同一卷会创建新的 generation_id。GET 绝不会根据 status、列表可见性或
        不存在打开文件来构造回执。
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 从持久回执存储中恢复的当前交接回执
          headers:
            Cache-Control:
              required: true
              description: 服务器端使代次失效后，缓存中绝不能继续保留该回执
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeSwapReceiptResourceV3"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            当前不存在成功的交接回执，或保留的回执已因卷、挂载代次或会话变更而失效。
          headers:
            Cache-Control:
              required: true
              description: 不存在这一结果与代次相关，因此不得缓存
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /preview:
    get:
      tags: [Capture]
      operationId: getPreview
      summary: 读取非权威的低帧率 JPEG 预览
      description: |
        预览投递绝不能对采集产生背压。multipart/x-mixed-replace 是实时流；image/jpeg
        返回最新可用帧后关闭连接。
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      parameters:
        - name: fps
          in: query
          required: false
          description: |
            请求的上限；设备可以投递更少帧，并根据实际处理能力限制请求。5 fps 是一个测量
            候选值，并非协议最大值或默认值。
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 根据 Accept 选择的最新预览图像或 multipart 流
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            image/jpeg:
              schema:
                type: string
                contentEncoding: binary
            multipart/x-mixed-replace:
              schema:
                type: string
                contentEncoding: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 当前设备状态下预览不可用
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: 当前没有可用的预览帧
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: 列出已密封会话候选项及其独立 gateway 判定
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          description: 返回的普通条目和隔离诊断的合计数量上限
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: take_id
          in: query
          required: false
          description: 仅筛选 schema 有效的条目；诊断项的 take 标识不受信任，因此始终可见
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: |
            已发现候选项的游标分页。每个 schema 有效的已密封 ylx.device-session.v1 候选项
        都恰好投影一次为 SessionSummary，并先按 manifest started_at、再按 session_id 最新优先排序。
            对于格式错误、不可读、未密封、schema 未知、schema 无效或 manifest 局部语义无效的
            manifest，只能恰好投影一次为闭合的 SessionDiscoveryDiagnostic，且不得通过虚构
            summary 字段将其提升至 items。不透明游标跨两个集合推进，limit 统计 items 与
            diagnostics 的总数，因此隔离的候选项不会造成空页循环。没有当前判定时，verification
            为 null；列出候选项绝不授予 artifact 下载或导出权限。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      operationId: getSession
      summary: 读取已密封会话 manifest
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |
            精确返回存储的 manifest.json 字节，与磁盘密封内容逐字节一致。服务器不得解析并
            重新序列化此响应。ETag 是这些精确字节的带引号 SHA-256。检查 manifest 不要求存在
            当前消费者本地的可用判定，但 artifact GET/HEAD、Range、导出和发布仍要求该判定。
          x-ylx-byte-preservation: exact-stored-bytes
          headers:
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            ETag:
              $ref: "#/components/headers/ETag"
            YLX-Manifest-SHA256:
              $ref: "#/components/headers/ManifestSha256"
          content:
            application/json:
              schema:
                $ref: "../schemas/ylx-device-session-v1.schema.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{session_id}/unsuccessful-outcome:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      operationId: getRetainedUnsuccessfulSessionOutcome
      summary: 读取一个保留的未成功生产者终止结果
      description: |
        返回此会话不可变的 recoverable、failed 或 abandoned Recording State，以及提交它的
        精确 daemon 权威 epoch 和源修订号。后续会话、daemon 重启、当前状态替换或 SSE 重放
        缓冲区淘汰都不得淘汰此资源。只要底层会话目录仍保留，404 就表示此会话从未提交过
        未成功的终止结果；不能根据它未出现在列表中推断该结果。
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 为所请求会话保留的未成功结果
          headers:
            Cache-Control:
              required: true
              description: 中间缓存不得隐藏授权和保留策略的变更
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetainedUnsuccessfulSessionResource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 此会话不存在保留的未成功结果
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{session_id}/artifacts/{artifact_id}:
    x-ylx-representation-contract:
      enforcement: procedural-custom-validator
      descriptor_source: verified-device-session-manifest.descriptor-by-artifact-id
      content_type_equals: descriptor.media_type
      etag_equals: quoted-descriptor.sha256
      complete_content_length_equals: descriptor.bytes
      partial_content_length_equals: selected-inclusive-range.bytes
      applies_to: [GET-200, GET-206, HEAD-200]
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Sessions]
      operationId: getSessionArtifact
      summary: 下载支持单范围请求的不可变 artifact 字节
      description: |
        服务器支持一个 RFC 9110 bytes 范围。多个范围会以 416 拒绝。ETag 是带引号的小写
        SHA-256 artifact_id，且永不改变。对于 200、206 和 HEAD，Content-Type 均为 manifest
        描述符中的 media_type。在采集、最终化、编码或生产者验证处于活动状态时发出的请求，
        会首先以 423 capture_busy 和显式空闲等待状态拒绝。设备空闲时，准入要求 gateway
        对精确的当前 manifest 字节作出当前可用判定。服务器会在解析 Range 或查询表示元数据前
        评估这两个门槛。判定不存在、不可用或已过期时，返回稳定的 409 session_not_verified
        响应，而不是用 404 隐藏 artifact，或通过 416 泄露 artifact 长度。
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfRange"
      responses:
        "200":
          description: 完整 artifact
          headers:
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Content-Type:
              $ref: "#/components/headers/ArtifactContentType"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            "*/*":
              schema:
                type: string
                contentEncoding: binary
        "206":
          description: 请求的闭区间字节范围
          headers:
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Content-Range:
              $ref: "#/components/headers/ContentRange"
            Content-Type:
              $ref: "#/components/headers/ArtifactContentType"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            "*/*":
              schema:
                type: string
                contentEncoding: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/SessionNotVerified"
        "423":
          $ref: "#/components/responses/CaptureBusy"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: 无法满足的字节范围或多个字节范围；Content-Range 报告完整长度
          headers:
            Content-Range:
              description: 未满足的范围格式，例如 bytes */12345
              required: true
              schema:
                type: string
                pattern: '^bytes \*/[0-9]+$'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    head:
      tags: [Sessions]
      operationId: headSessionArtifact
      summary: 读取不可变 artifact 元数据且不返回响应体
      description: |
        使用与 GET 相同的采集忙碌和当前判定准入顺序。设备忙碌状态返回 423 capture_busy，
        并携带 Retry-After 和 YLX-Wait-State；判定不存在、不可用或已过期时返回
        409 session_not_verified。按照 HEAD 语义，任何状态都不发送响应体。
      x-ylx-lab-access: allowed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: artifact 存在；header 与完整 GET 一致
          headers:
            Accept-Ranges:
              $ref: "#/components/headers/AcceptRanges"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Content-Type:
              $ref: "#/components/headers/ArtifactContentType"
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/UnauthorizedHead"
        "403":
          $ref: "#/components/responses/ForbiddenHead"
        "409":
          $ref: "#/components/responses/SessionNotVerifiedHead"
        "423":
          $ref: "#/components/responses/CaptureBusyHead"
        "404":
          $ref: "#/components/responses/NotFoundHead"
        "500":
          $ref: "#/components/responses/InternalErrorHead"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Customer profile 的 bearer token。绝不接受在查询参数中传递 token。
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      description: 来自会话 manifest 的小写 SHA-256 内容标识
      schema:
        $ref: "#/components/schemas/Sha256"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        作用域限定为已认证客户主体或隔离实验室设备的不透明键。至少保留 24 小时；
        长度为 1 至 128 个不含空格的可见 ASCII 字符。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!#-~]+$'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: 最近完整处理的十进制 SSE 投递 ID；不是 daemon 源修订号
      schema:
        type: string
        pattern: '^[0-9]+$'
    Range:
      name: Range
      in: header
      required: false
      description: 一个 RFC 9110 bytes 范围；不支持 multipart 范围
      schema:
        type: string
        pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
    IfRange:
      name: If-Range
      in: header
      required: false
      description: 先前由 GET 或 HEAD 返回的带引号 SHA-256 ETag
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
  headers:
    AcceptRanges:
      description: 支持的范围单位
      required: true
      schema:
        type: string
        const: bytes
    ContentLength:
      description: 十进制表示长度；对于 HEAD，这是完整 GET 响应体的长度
      required: true
      schema:
        type: integer
        minimum: 0
    ContentRange:
      description: 返回的闭区间字节范围和完整 artifact 大小
      required: true
      schema:
        type: string
        pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'
    ETag:
      description: 强校验、带引号的小写 SHA-256 内容标识
      required: true
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
    ArtifactContentType:
      description: 匹配的已密封 manifest artifact 描述符所声明的精确 media_type
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9!#$&^_.+-]+/[a-z0-9!#$&^_.+-]+$'
    ManifestSha256:
      description: 精确存储的 manifest 响应字节的小写 SHA-256；等于去除引号的 ETag
      required: true
      schema:
        $ref: "#/components/schemas/Sha256"
    IdempotencyReplayed:
      description: 当此响应从幂等存储重放时为 true
      required: false
      schema:
        type: boolean
  responses:
    BadRequest:
      description: 请求格式错误或参数不受支持
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 缺少 Customer profile bearer 凭据或凭据无效
      headers:
        WWW-Authenticate:
          description: Customer profile bearer 质询
          schema:
            type: string
            pattern: '^Bearer(?: .*)?$'
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedHead:
      description: 缺少 Customer profile bearer 凭据或凭据无效；HEAD 不发送响应体
      headers:
        WWW-Authenticate:
          description: Customer profile bearer 质询
          required: true
          schema:
            type: string
            pattern: '^Bearer(?: .*)?$'
    Forbidden:
      description: 已认证的 Customer 主体无权访问此操作或资源
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenHead:
      description: 已认证的 Customer 主体未获授权；HEAD 不发送响应体
    NotFound:
      description: 资源不存在或尚未密封
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundHead:
      description: 资源不存在或尚未密封；HEAD 不发送响应体
    Conflict:
      description: 命令与 daemon 状态冲突，或以不同输入复用了 Idempotency-Key
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SessionNotVerified:
      description: |
        已密封会话或 artifact 存在，但 gateway 对精确的当前 manifest 字节没有当前可用判定。
        这包括判定不存在、不可用、已过期或摘要不匹配的情况。GET 返回 problem 响应体。
      headers:
        YLX-Error-Code:
          required: true
          schema:
            type: string
            const: session_not_verified
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/SessionNotVerifiedError"
    SessionNotVerifiedHead:
      description: |
        已密封会话或 artifact 存在，但 gateway 对精确的当前 manifest 字节没有当前可用判定。
        HEAD 不发送响应体。
      headers:
        YLX-Error-Code:
          required: true
          schema:
            type: string
            const: session_not_verified
    CaptureBusy:
      description: |
        当采集、最终化、编码或生产者验证占用设备资源时，artifact IO 暂停。客户端等待由 daemon
        权威确定的空闲状态后再重试。GET 返回类型化 problem 响应体。
      headers:
        YLX-Error-Code:
          required: true
          schema:
            type: string
            const: capture_busy
        YLX-Wait-State:
          required: true
          schema:
            type: string
            const: idle
        Retry-After:
          required: true
          description: 再次轮询状态前保守估计的整数秒数；客户端仍需等待空闲快照
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CaptureBusyError"
    CaptureBusyHead:
      description: |
        采集资源处于活动状态时，artifact IO 暂停。HEAD 不发送响应体，并携带与 GET 相同的
        稳定重试和等待状态 header。
      headers:
        YLX-Error-Code:
          required: true
          schema:
            type: string
            const: capture_busy
        YLX-Wait-State:
          required: true
          schema:
            type: string
            const: idle
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
    UnprocessableEntity:
      description: 请求格式正确，但未通过准入检查
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 非预期设备错误
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalErrorHead:
      description: 非预期设备错误；HEAD 不发送响应体
  schemas:
    UuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: 规范的小写 UUIDv7
    UuidV4:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: 规范的小写随机 UUIDv4
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    DeviceIdentity:
      type: object
      additionalProperties: false
      required: [device_id, device_label]
      properties:
        device_id:
          $ref: "#/components/schemas/UuidV4"
        device_label:
          type: string
          pattern: '^YLX-[0-9A-F]{8}$'
          description: 仅用于显示的标签
    DeviceDescriptor:
      type: object
      additionalProperties: false
      required:
        - schema
        - device
        - hardware_fingerprint
        - api_version
        - build
        - security_profile
        - capabilities
        - storage
        - runtime
      properties:
        schema:
          const: ylx.device.v3
        device:
          $ref: "#/components/schemas/DeviceIdentity"
        hardware_fingerprint:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: 用于诊断的硬件绑定；绝不是设备标识或授权键
        api_version:
          const: "3.0"
        build:
          type: object
          additionalProperties: false
          required: [package_version, commit, build_id]
          properties:
            package_version:
              type: string
              minLength: 1
              maxLength: 64
              description: 单调递增的软件包版本，与项目里程碑名称无关
            commit:
              type: string
              pattern: '^[0-9a-f]{40,64}$'
            build_id:
              type: string
              minLength: 1
              maxLength: 128
        security_profile:
          enum: [customer, lab]
        capabilities:
          type: object
          additionalProperties: false
          required: [capture, preview, range_download, network_mutation]
          properties:
            capture:
              type: boolean
            preview:
              type: boolean
            range_download:
              const: true
            network_mutation:
              const: false
              description: 此契约不公开网络变更；未来的任何产品路由由 DX-05 负责。
        storage:
          type: object
          additionalProperties: false
          required: [volume_id, total_bytes, available_bytes, writable]
          properties:
            volume_id:
              description: 当前没有已准入录制卷时为 null。
              oneOf:
                - $ref: "#/components/schemas/UuidV4"
                - type: "null"
            total_bytes:
              type: integer
              minimum: 0
            available_bytes:
              type: integer
              minimum: 0
            writable:
              type: boolean
        runtime:
          $ref: "#/components/schemas/DeviceRuntimeStatus"
      allOf:
        - if:
            required: [security_profile]
            properties:
              security_profile:
                const: lab
          then:
            properties:
              capabilities:
                type: object
                required: [network_mutation]
                properties:
                  network_mutation:
                    const: false
    DeviceRuntimeStatus:
      type: object
      additionalProperties: false
      required: [observed_at, connection_method, temperature_celsius, network, live_imu]
      properties:
        observed_at:
          type: string
          format: date-time
          description: 此 runtime 观测中所有字段完成协调时的时间戳
        connection_method:
          enum: [wifi_ap, wifi_client, ethernet_direct, ethernet_lan, offline]
          description: 当前浏览器到设备的可达模式，而非推断出的首选模式
        temperature_celsius:
          type: number
          minimum: -40
          maximum: 125
          description: 当前 SoC 温度读数，单位为摄氏度
        network:
          $ref: "#/components/schemas/NetworkRuntimeStatus"
        live_imu:
          oneOf:
            - $ref: "#/components/schemas/LiveImuObservation"
            - type: "null"
          description: 最新且未过期的实时样本；没有可用的活动会话样本时为 null
    NetworkRuntimeStatus:
      type: object
      additionalProperties: false
      required: [ap, wifi_client, wired, default_route]
      properties:
        ap:
          $ref: "#/components/schemas/NetworkInterfaceStatus"
        wifi_client:
          $ref: "#/components/schemas/NetworkInterfaceStatus"
        wired:
          $ref: "#/components/schemas/NetworkInterfaceStatus"
        default_route:
          enum: [wifi_client, wired, none]
          description: 当前拥有默认路由的接口类别
    NetworkInterfaceStatus:
      type: object
      additionalProperties: false
      required: [state, interface, addresses, peer_or_ssid]
      properties:
        state:
          enum: [disabled, disconnected, starting, connecting, connected, active, degraded, failed, unavailable]
        interface:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
              pattern: '^[A-Za-z0-9_.:-]+$'
            - type: "null"
        addresses:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        peer_or_ssid:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: "null"
          default: null
      allOf:
        - if:
            required: [state]
            properties:
              state:
                enum: [connected, active, degraded]
          then:
            properties:
              interface:
                type: string
                minLength: 1
                maxLength: 64
              addresses:
                minItems: 1
    LiveImuObservation:
      type: object
      additionalProperties: false
      required: [session_id, clock, raw, sync]
      properties:
        session_id:
          $ref: "#/components/schemas/UuidV7"
        clock:
          type: object
          additionalProperties: false
          required: [time_base, timestamp_ns]
          properties:
            time_base:
              const: host_monotonic
            timestamp_ns:
              type: integer
              minimum: 0
        raw:
          type: object
          additionalProperties: false
          required: [units, accelerometer, gyroscope]
          properties:
            units:
              const: raw_int16
            accelerometer:
              $ref: "#/components/schemas/RawImuVector3"
            gyroscope:
              $ref: "#/components/schemas/RawImuVector3"
        sync:
          type: object
          additionalProperties: false
          required: [quality]
          properties:
            quality:
              enum: [insufficient, good, degraded]
    RawImuVector3:
      type: object
      additionalProperties: false
      required: [x, y, z]
      properties:
        x: {type: integer, minimum: -32768, maximum: 32767}
        y: {type: integer, minimum: -32768, maximum: 32767}
        z: {type: integer, minimum: -32768, maximum: 32767}
    CaptureStartRequest:
      type: object
      additionalProperties: false
      required: [schema, mode, take]
      properties:
        schema:
          const: ylx.capture-start.v2
        mode:
          enum: [production, calibration]
        volume_id:
          $ref: "#/components/schemas/UuidV4"
          description: 省略时使用 daemon 准入的当前卷
        display_name:
          type: string
          minLength: 1
          maxLength: 160
          description: 可选的人类可读覆盖值；绝不会成为标识
        take:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  const: new
            - type: object
              additionalProperties: false
              required: [kind, continuation_of]
              properties:
                kind:
                  const: continue
                continuation_of:
                  $ref: "#/components/schemas/UuidV7"
          description: |
            对于 new，daemon 分配 take_id 和序号 1。对于 continue，daemon 验证同一设备上
            已密封的前序会话，派生其 take_id 和下一序号，并以 422 拒绝分支或不匹配情况。
    CaptureStopRequest:
      type: object
      additionalProperties: false
      required: [schema, reason]
      properties:
        schema:
          const: ylx.capture-stop.v2
        reason:
          enum: [user, safe_swap]
    CaptureStatusSnapshot:
      type: object
      additionalProperties: false
      required: [schema, authority_epoch, source_revision, snapshot]
      properties:
        schema:
          const: ylx.capture-status.v2
        authority_epoch:
          $ref: "#/components/schemas/UuidV4"
          description: 当前 daemon 权威生命周期，由 gateway 原样复制且不替换
        source_revision:
          type: integer
          minimum: 0
          description: 快照的当前 daemon journal 修订号；绝不是 SSE 投递 ID
        snapshot:
          $ref: "#/components/schemas/CaptureSnapshotEventData"
      description: |
        对 SSE 同样承载的精确快照 payload 的 HTTP 包装。当 payload 包含活动或保留的
        Recording State 时，其 authority_epoch 和 state_revision 分别等于此包装的
        authority_epoch 和 source_revision。
    CaptureEvent:
      type: object
      additionalProperties: false
      required: [schema, sse_delivery_id, authority_epoch, source_revision, type, occurred_at, session_id, data]
      properties:
        schema:
          const: ylx.capture-event.v3
        sse_delivery_id:
          type: string
          pattern: '^[0-9]+$'
          description: 传输重放标识；等于 SSE id 字段，绝不替代 source_revision
        authority_epoch:
          $ref: "#/components/schemas/UuidV4"
          description: 经 IPC 和 gateway 原样复制的稳定 daemon 权威生命周期
        source_revision:
          type: integer
          minimum: 0
          description: 经 IPC 和 gateway 原样复制的持久 daemon 权威修订号
        type:
          enum: [snapshot, state, progress, diagnostic, safe_swap]
        occurred_at:
          type: string
          format: date-time
        session_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
          description: 目标会话标识；仅无会话的空闲/阻塞快照或设备级诊断允许为 null
        data:
          type: object
          description: 由 type 选择的闭合 payload；消费者绝不从扩展容器推断字段
      allOf:
        - if:
            required: [type]
            properties:
              type:
                const: safe_swap
          then:
            properties:
              session_id:
                $ref: "#/components/schemas/UuidV7"
              data:
                $ref: "#/components/schemas/SafeSwapReceiptV3"
        - if:
            required: [type]
            properties:
              type:
                const: snapshot
          then:
            properties:
              data:
                $ref: "#/components/schemas/CaptureSnapshotEventData"
        - if:
            required: [type]
            properties:
              type:
                const: state
          then:
            properties:
              session_id:
                $ref: "#/components/schemas/UuidV7"
              data:
                $ref: "#/components/schemas/CaptureStateEventData"
        - if:
            required: [type]
            properties:
              type:
                const: progress
          then:
            properties:
              session_id:
                $ref: "#/components/schemas/UuidV7"
              data:
                $ref: "#/components/schemas/CaptureProgressEventData"
        - if:
            required: [type]
            properties:
              type:
                const: diagnostic
          then:
            properties:
              data:
                $ref: "#/components/schemas/CaptureDiagnosticEventData"
    CaptureSnapshotEventData:
      type: object
      additionalProperties: false
      required: [schema, device_state, active_recording, retained_unsuccessful, runtime]
      properties:
        schema:
          const: ylx.capture-snapshot-event.v2
        device_state:
          enum: [idle, recording, finalizing, verifying, blocked]
        active_recording:
          oneOf:
            - $ref: "#/components/schemas/CaptureActiveRecording"
            - type: "null"
          description: 当前活动生产者状态；仅在设备处于活动状态时非 null
        retained_unsuccessful:
          oneOf:
            - $ref: "#/components/schemas/CaptureRetainedUnsuccessfulRecording"
            - type: "null"
          description: 空闲时最近一次未成功的终止结果；历史结果仍可按会话查询
        runtime:
          $ref: "#/components/schemas/DeviceRuntimeStatus"
      allOf:
        - if:
            required: [device_state]
            properties:
              device_state:
                enum: [recording, finalizing, verifying]
          then:
            properties:
              active_recording:
                $ref: "#/components/schemas/CaptureActiveRecording"
              retained_unsuccessful:
                type: "null"
          else:
            properties:
              active_recording:
                type: "null"
        - if:
            required: [device_state]
            properties:
              device_state:
                const: blocked
          then:
            properties:
              retained_unsuccessful:
                type: "null"
    CaptureSnapshotRecording:
      type: object
      additionalProperties: false
      required: [generation_id, recording_state]
      properties:
        generation_id:
          $ref: "#/components/schemas/UuidV4"
        recording_state:
          $ref: "../schemas/ylx-recording-state-v1.schema.json"
      description: 挂载代次及完整、无损持久化的 Recording State
    CaptureActiveRecording:
      allOf:
        - $ref: "#/components/schemas/CaptureSnapshotRecording"
        - type: object
          properties:
            recording_state:
              type: object
              required: [state]
              properties:
                state:
                  enum: [recording, finalizing, verifying]
    CaptureRetainedUnsuccessfulRecording:
      allOf:
        - $ref: "#/components/schemas/CaptureSnapshotRecording"
        - type: object
          properties:
            recording_state:
              type: object
              required: [state]
              properties:
                state:
                  enum: [recoverable, failed, abandoned]
    CaptureStateEventData:
      type: object
      additionalProperties: false
      required: [schema, state, volume_id, generation_id]
      properties:
        schema:
          const: ylx.capture-state-event.v2
        state:
          enum: [recording, finalizing, verifying, recoverable, failed, abandoned]
        volume_id:
          $ref: "#/components/schemas/UuidV4"
        generation_id:
          $ref: "#/components/schemas/UuidV4"
    CaptureProgressEventData:
      type: object
      additionalProperties: false
      required: [schema, phase, elapsed_seconds, completed_units, total_units, unit]
      properties:
        schema:
          const: ylx.capture-progress-event.v2
        phase:
          enum: [recording, finalizing, verifying]
        elapsed_seconds:
          type: number
          minimum: 0
        completed_units:
          type: integer
          minimum: 0
        total_units:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        unit:
          enum: [frames, bytes, artifacts, checks]
      allOf:
        - if:
            required: [total_units]
            properties:
              total_units:
                type: integer
          then:
            properties:
              completed_units:
                type: integer
                minimum: 0
    CaptureDiagnosticEventData:
      type: object
      additionalProperties: false
      required: [schema, diagnostic]
      properties:
        schema:
          const: ylx.capture-diagnostic-event.v2
        diagnostic:
          $ref: "#/components/schemas/CaptureDiagnostic"
    CaptureDiagnostic:
      $ref: "../schemas/ylx-recording-state-v1.schema.json#/$defs/diagnostic"
      description: 精确的 Recording State 诊断；不会丢弃时间戳、detail 字段或任何 message 字节
    SafeSwapReceiptV3:
      type: object
      additionalProperties: false
      required:
        - schema
        - session_id
        - volume_id
        - generation_id
        - manifest_id
        - manifest_sha256
        - sealed_at
        - released_at
        - release_state
        - open_handle_count
      properties:
        schema:
          const: ylx.safe-swap-receipt.v3
        session_id:
          $ref: "#/components/schemas/UuidV7"
        volume_id:
          $ref: "#/components/schemas/UuidV4"
        generation_id:
          $ref: "#/components/schemas/UuidV4"
          description: 已准入挂载 epoch 的持久标识。
        manifest_id:
          $ref: "#/components/schemas/UuidV7"
        manifest_sha256:
          $ref: "#/components/schemas/Sha256"
          description: 精确、持久密封的 manifest 字节的 SHA-256。
        sealed_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
        release_state:
          enum: [unmounted, device-released]
        open_handle_count:
          const: 0
      description: |
        最小化的生产 safe-swap 交接回执。它证明 manifest 已密封、挂载代次已释放且观测到的
        打开句柄数为零，同时不携带部署、绑定、参与者权威或句柄审计数据。
    RetainedUnsuccessfulSessionResource:
      type: object
      additionalProperties: false
      required: [schema, authority_epoch, source_revision, outcome]
      properties:
        schema:
          const: ylx.retained-unsuccessful-session-resource.v2
        authority_epoch:
          $ref: "#/components/schemas/UuidV4"
        source_revision:
          type: integer
          minimum: 0
        outcome:
          $ref: "#/components/schemas/CaptureRetainedUnsuccessfulRecording"
      description: |
        按会话保留的终止资源。authority_epoch 和 source_revision 分别精确等于
        outcome.recording_state 的 authority_epoch 和 state_revision。
    SafeSwapReceiptResourceV3:
      type: object
      additionalProperties: false
      required: [schema, receipt]
      properties:
        schema:
          const: ylx.safe-swap-receipt-resource.v3
        receipt:
          $ref: "#/components/schemas/SafeSwapReceiptV3"
      description: 对类型化 safe_swap 事件中发出的精确当前 v3 回执进行查询的包装。
    SessionSummary:
      type: object
      additionalProperties: false
      required:
        - session_id
        - producer_outcome
        - take_id
        - take_sequence
        - continuation_of
        - display_name
        - device
        - started_at
        - ended_at
        - duration_seconds
        - total_bytes
        - verification
      properties:
        session_id:
          $ref: "#/components/schemas/UuidV7"
        producer_outcome:
          const: sealed
          description: 不可变 manifest 所表示的生产者终止结果
        take_id:
          $ref: "#/components/schemas/UuidV7"
        take_sequence:
          type: integer
          minimum: 1
          description: manifest take.sequence 的精确副本
        continuation_of:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
          description: manifest take.continuation_of 的精确副本
        display_name:
          type: string
          minLength: 1
          maxLength: 160
          description: 从已密封 manifest 复制的历史显示专用值
        device:
          $ref: "#/components/schemas/DeviceIdentity"
          description: 从已密封 manifest 复制的历史设备标识和标签，绝不是当前可变展示数据
        started_at:
          type: string
          format: date-time
          description: manifest time.started_at 的精确投影
        ended_at:
          type: string
          format: date-time
          description: manifest time.ended_at 的精确投影
        duration_seconds:
          type: number
          minimum: 0
          description: manifest time.duration_seconds 的精确投影
        total_bytes:
          type: integer
          minimum: 0
          description: manifest 中可下载且唯一的 artifact 描述符字节数之和；不含 manifest.json、录制状态和临时文件
        verification:
          oneOf:
            - $ref: "#/components/schemas/GatewayVerification"
            - type: "null"
          description: gateway 本地对这些精确 manifest 字节的当前判定；不存在或已过期时为 null
    GatewayVerification:
      type: object
      additionalProperties: false
      required: [actor, validator, manifest_sha256, verified_at, verdict, diagnostics]
      properties:
        actor:
          const: gateway
        validator:
          type: object
          additionalProperties: false
          required: [name, version, build_sha256]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 128
            version:
              type: string
              minLength: 1
              maxLength: 64
            build_sha256:
              $ref: "#/components/schemas/Sha256"
        manifest_sha256:
          $ref: "#/components/schemas/Sha256"
        verified_at:
          type: string
          format: date-time
        verdict:
          enum: [usable, unusable]
        diagnostics:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 512
      allOf:
        - if:
            required: [verdict]
            properties:
              verdict:
                const: unusable
          then:
            properties:
              diagnostics:
                minItems: 1
    SessionList:
      type: object
      additionalProperties: false
      required: [schema, items, diagnostics, next_cursor]
      properties:
        schema:
          const: ylx.session-list.v2
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        diagnostics:
          type: array
          description: 无法满足 SessionSummary 的隔离发现记录
          items:
            $ref: "#/components/schemas/SessionDiscoveryDiagnostic"
        next_cursor:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
    SessionDiscoveryDiagnostic:
      type: object
      additionalProperties: false
      required: [quarantine_id, code, observed_at, message]
      properties:
        quarantine_id:
          $ref: "#/components/schemas/UuidV4"
          description: 稳定的不透明关联标识；绝不是文件系统路径或会话标识
        code:
          enum: [manifest_unreadable, unsupported_schema, manifest_invalid, manifest_not_sealed]
          description: |
            manifest_unreadable 涵盖格式错误的字节和读取失败；unsupported_schema 涵盖未知
            discriminator；manifest_invalid 涵盖闭合 schema 或 manifest 局部标识、take、路径、
            密封语义失败；manifest_not_sealed 涵盖可读取、受支持但未密封的对象。
        observed_at:
          type: string
          format: date-time
        message:
          type: string
          minLength: 1
          maxLength: 512
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [schema, error]
      properties:
        schema:
          const: ylx.api-error.v2
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
              pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
            message:
              type: string
              minLength: 1
              maxLength: 1024
            request_id:
              type: string
              format: uuid
            retryable:
              type: boolean
            details:
              type: object
              description: 显式错误码扩展容器。消费者只能在此处忽略未知键。
              additionalProperties: true
    SessionNotVerifiedError:
      type: object
      additionalProperties: false
      required: [schema, error]
      properties:
        schema:
          const: ylx.api-error.v2
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              const: session_not_verified
            message:
              type: string
              minLength: 1
              maxLength: 1024
            request_id:
              type: string
              format: uuid
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  enum: [absent, unusable, stale]
    CaptureBusyError:
      type: object
      additionalProperties: false
      required: [schema, error]
      properties:
        schema:
          const: ylx.api-error.v2
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable, details]
          properties:
            code:
              const: capture_busy
            message:
              type: string
              minLength: 1
              maxLength: 1024
            request_id:
              type: string
              format: uuid
            retryable:
              const: true
            details:
              type: object
              additionalProperties: false
              required: [wait_for, retry_after_seconds, current_state]
              properties:
                wait_for:
                  const: idle
                retry_after_seconds:
                  type: integer
                  minimum: 1
                current_state:
                  enum: [recording, finalizing, verifying]
