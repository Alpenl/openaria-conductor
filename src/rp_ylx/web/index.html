<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>RP-YLX 设备工作台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <h1>RP-YLX</h1>
        <p id="device-label">录制设备</p>
      </div>
      <output class="connection" data-state="connecting" aria-live="polite">正在连接</output>
    </header>

    <section class="credential-prompt" aria-label="设备认证" hidden>
      <form id="credential-form">
        <label class="field-label" for="access-token">设备访问令牌</label>
        <div class="credential-controls">
          <input
            id="access-token"
            name="access_token"
            type="password"
            autocomplete="off"
            spellcheck="false"
            required
          />
          <button class="secondary-command" type="submit">连接设备</button>
        </div>
      </form>
    </section>

    <div class="alerts" aria-live="assertive" aria-atomic="true"></div>
    <main class="workspace">
      <section class="preview-panel panel" aria-labelledby="preview-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">实时观察</p>
            <h2 id="preview-title">左眼预览</h2>
          </div>
          <span class="status-chip" id="preview-status">等待画面</span>
        </div>
        <div class="preview-frame" aria-label="左眼预览画面">
          <img data-testid="preview-image" alt="左眼实时预览" />
          <p id="preview-placeholder">连接设备后显示最新画面</p>
        </div>
      </section>

      <aside class="control-panel panel" aria-label="录制控制">
        <div class="section-heading">
          <div>
            <p class="eyebrow">设备状态</p>
            <h2 data-testid="capture-state">未连接</h2>
          </div>
        </div>
        <form id="capture-form">
          <label class="field-label" for="capture-name">录制名称</label>
          <input
            id="capture-name"
            name="display_name"
            type="text"
            maxlength="160"
            autocomplete="off"
            placeholder="例如：走廊采集 01"
            required
          />
          <button class="primary-command" id="capture-command" type="submit" disabled>
            开始录制
          </button>
        </form>
        <div class="stop-actions" hidden>
          <button class="secondary-command" id="stop-command" type="button">结束录制</button>
          <button
            class="secondary-command danger-command"
            id="safe-swap-command"
            type="button"
            title="结束并封存当前会话，等待设备释放存储介质"
          >
            安全换盘
          </button>
        </div>
        <div class="current-session" hidden>
          <span>当前会话</span>
          <strong data-testid="current-session-name"></strong>
          <dl class="capture-progress">
            <div>
              <dt>时长</dt>
              <dd data-testid="elapsed-seconds">0.0 秒</dd>
            </div>
            <div>
              <dt>帧数</dt>
              <dd data-testid="captured-frames">0</dd>
            </div>
            <div>
              <dt>写入</dt>
              <dd data-testid="bytes-written">0.0 MiB</dd>
            </div>
          </dl>
        </div>
      </aside>

      <section class="safe-swap panel" aria-labelledby="safe-swap-title" hidden>
        <div class="section-heading compact-heading">
          <div>
            <p class="eyebrow">存储介质</p>
            <h2 id="safe-swap-title">可以移除存储设备</h2>
          </div>
        </div>
        <dl class="receipt-facts">
          <div>
            <dt>释放结果</dt>
            <dd data-testid="safe-swap-release"></dd>
          </div>
          <div>
            <dt>会话</dt>
            <dd data-testid="safe-swap-session"></dd>
          </div>
        </dl>
      </section>

      <section class="telemetry panel" aria-labelledby="telemetry-title">
        <div class="section-heading compact-heading">
          <div>
            <p class="eyebrow">实时数据</p>
            <h2 id="telemetry-title">IMU</h2>
          </div>
        </div>
        <dl class="telemetry-list">
          <div>
            <dt>加速度</dt>
            <dd data-testid="acceleration">不可用</dd>
          </div>
          <div>
            <dt>角速度</dt>
            <dd data-testid="angular-velocity">不可用</dd>
          </div>
          <div>
            <dt>姿态四元数</dt>
            <dd data-testid="orientation">不可用</dd>
          </div>
        </dl>
      </section>

      <section class="device-facts panel" aria-labelledby="device-title">
        <div class="section-heading compact-heading">
          <div>
            <p class="eyebrow">设备</p>
            <h2 id="device-title">运行状态</h2>
          </div>
        </div>
        <dl class="facts-grid">
          <div>
            <dt>剩余容量</dt>
            <dd data-testid="storage-available">--</dd>
          </div>
          <div>
            <dt>温度</dt>
            <dd data-testid="temperature">--</dd>
          </div>
          <div>
            <dt>连接</dt>
            <dd data-testid="connection-method">--</dd>
          </div>
          <div>
            <dt>存储</dt>
            <dd data-testid="storage-writable">--</dd>
          </div>
        </dl>
      </section>

      <section class="sessions panel" aria-labelledby="sessions-title">
        <div class="section-heading compact-heading">
          <div>
            <p class="eyebrow">历史记录</p>
            <h2 id="sessions-title">最近会话</h2>
          </div>
        </div>
        <div id="session-list">
          <p class="empty-state">会话列表尚未加载</p>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
