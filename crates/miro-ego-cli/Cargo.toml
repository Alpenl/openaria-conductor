[package]
name = "miro-ego-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "miro_ego_cli"
path = "src/lib.rs"

[[bin]]
name = "miro-ego"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
libc.workspace = true
miro-ego-api.workspace = true
miro-ego-capture.workspace = true
miro-ego-core.workspace = true
miro-ego-deploy.workspace = true
miro-ego-hw.workspace = true
miro-ego-network.workspace = true
miro-ego-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }

[dev-dependencies]
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
