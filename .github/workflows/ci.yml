name: CI

on:
  push:
    branches: [main, refactor/0.3.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Rust toolchain, GCC, and shellcheck
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y build-essential shellcheck

      - name: Sync host tooling and verification environment
        run: uv sync --frozen --extra dev

      - name: Run shellcheck on Miro-Ego deploy scripts
        run: |
          mapfile -t deploy_scripts < <(grep -l '^#!' deploy/miro-ego/*)
          test "${#deploy_scripts[@]}" -gt 0
          shellcheck "${deploy_scripts[@]}"

      - name: Run full hardware-free verification suite
        run: |
          uv run --extra dev python scripts/release_version.py
          CI=true uv run --extra dev python scripts/check.py --require-shellcheck

      - name: Build release miro-ego binary and verify version
        run: |
          MIRO_EGO_GIT_COMMIT="$(git rev-parse HEAD)"
          export MIRO_EGO_GIT_COMMIT
          cargo build --release -p miro-ego-cli
          build_info="$(./target/release/miro-ego --version)"
          echo "$build_info"
          expected_version="$(uv run --extra dev python scripts/release_version.py)"
          case "$build_info" in
            *"$expected_version"*) ;;
            *)
              echo "Unexpected miro-ego --version output: $build_info (expected $expected_version)" >&2
              exit 1
              ;;
          esac
          mkdir -p dist
          cp target/release/miro-ego dist/miro-ego
          printf '%s\n' "$build_info" > dist/build-info.txt

      - uses: actions/upload-artifact@v7
        with:
          name: miro-ego-linux-x86_64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
