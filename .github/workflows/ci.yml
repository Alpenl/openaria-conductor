name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install Python dependencies
        run: uv sync --frozen --extra dev
      - name: Run hardware-free checks
        run: uv run python scripts/check.py
      - name: Build distribution
        run: |
          uv build
          uv venv --no-project /tmp/rp-ylx-wheel-venv
          uv pip install --python /tmp/rp-ylx-wheel-venv/bin/python dist/*.whl
          build_info="$(cd /tmp && /tmp/rp-ylx-wheel-venv/bin/openaria --version)"
          expected_build_info="$(cd /tmp && /tmp/rp-ylx-wheel-venv/bin/python -c 'from rp_ylx import PRODUCT_NAME, __version__; import os; print("{} {} ({})".format(PRODUCT_NAME, __version__, os.environ["GITHUB_SHA"]))')"
          test "$build_info" = "$expected_build_info"
          printf '%s\n' "$build_info" > dist/build-info.txt
      - uses: actions/upload-artifact@v7
        with:
          name: rp-ylx-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
