name: Miro-Ego RDK X5 Native Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
      - "refactor/0.3.0"
  pull_request:
    branches:
      - main
      - "refactor/0.3.0"
    paths:
      - ".github/workflows/rdk-x5-bundle.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "csrc/**"
      - "deploy/miro-ego/**"
      - "share/voice/**"
      - "contracts/miro-ego-*"
      - "contracts/schemas/miro-ego-*"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/build_rdk_x5_bundle.py"
      - "scripts/check.py"
      - "scripts/release_version.py"

permissions:
  contents: read

concurrency:
  group: miro-ego-rdk-x5-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Pure-Native RDK X5 AArch64 Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Resolve and validate Miro-Ego version identity
        run: |
          uv sync --frozen --extra dev
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$(uv run --extra dev python scripts/release_version.py --tag "$GITHUB_REF_NAME")"
          else
            version="$(uv run --extra dev python scripts/release_version.py)"
          fi
          commit="$(git rev-parse HEAD)"
          {
            echo "MIRO_EGO_VERSION=${version}"
            echo "MIRO_EGO_COMMIT=${commit}"
            echo "MIRO_EGO_GIT_COMMIT=${commit}"
          } >> "$GITHUB_ENV"
          echo "Resolved Miro-Ego ${version} (${commit})"

      - name: Install Rust toolchain (aarch64 target), GCC, and shellcheck
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target aarch64-unknown-linux-gnu
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y build-essential shellcheck

      - name: Run full hardware-free checks
        run: |
          CI=true uv run --extra dev python scripts/check.py --require-shellcheck

      - name: Install zig and cargo-zigbuild for AArch64 cross-compilation
        run: |
          uv venv --no-project /tmp/miro-ego-cross
          uv pip install --python /tmp/miro-ego-cross/bin/python 'ziglang==0.16.0' 'cargo-zigbuild'
          zig_dir="$(
            /tmp/miro-ego-cross/bin/python - <<'PY'
          from pathlib import Path
          import ziglang
          print(Path(ziglang.__file__).resolve().parent)
          PY
          )"
          test -x "$zig_dir/zig"
          test -x /tmp/miro-ego-cross/bin/cargo-zigbuild
          echo "/tmp/miro-ego-cross/bin" >> "$GITHUB_PATH"
          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version
          /tmp/miro-ego-cross/bin/cargo-zigbuild --version

      - name: Cross-compile pure-Rust miro-ego for aarch64-unknown-linux-gnu
        env:
          MIRO_EGO_RELEASE_PUBLIC_KEY_HEX: ${{ secrets.MIRO_EGO_RELEASE_PUBLIC_KEY_HEX || vars.MIRO_EGO_RELEASE_PUBLIC_KEY_HEX || '' }}
          MIRO_EGO_RELEASE_SIGNING_SEED_HEX: ${{ secrets.MIRO_EGO_RELEASE_SIGNING_SEED_HEX || '' }}
        run: |
          if [[ -z "${MIRO_EGO_RELEASE_PUBLIC_KEY_HEX}" && -n "${MIRO_EGO_RELEASE_SIGNING_SEED_HEX}" ]]; then
            MIRO_EGO_RELEASE_PUBLIC_KEY_HEX="$(
              uv run --extra dev python - <<'PY'
          import os
          from scripts.build_rdk_x5_bundle import resolve_signing_seed, sign_manifest_bytes
          seed = resolve_signing_seed(os.environ["MIRO_EGO_RELEASE_SIGNING_SEED_HEX"])
          _, pub_hex = sign_manifest_bytes(b"", seed)
          print(pub_hex)
          PY
            )"
          fi
          if [[ -n "${MIRO_EGO_RELEASE_PUBLIC_KEY_HEX}" ]]; then
            export MIRO_EGO_RELEASE_PUBLIC_KEY_HEX
            echo "MIRO_EGO_RELEASE_PUBLIC_KEY_HEX=${MIRO_EGO_RELEASE_PUBLIC_KEY_HEX}" >> "$GITHUB_ENV"
          else
            unset MIRO_EGO_RELEASE_PUBLIC_KEY_HEX
          fi
          unset MIRO_EGO_RELEASE_SIGNING_SEED_HEX
          export MIRO_EGO_GIT_COMMIT="${MIRO_EGO_COMMIT}"
          cargo zigbuild --locked --release --target aarch64-unknown-linux-gnu.2.28 -p miro-ego-cli

      - name: Cross-compile C miro-ego-encoder for aarch64-unknown-linux-gnu
        run: |
          mkdir -p dist-aarch64
          SRCS=(
            csrc/miro-ego-encoder/miro_ego_stereo_encoder.c
            csrc/miro-ego-encoder/miro_ego_stereo_pipeline.c
            csrc/miro-ego-encoder/miro_ego_shm_ring.c
            csrc/miro-ego-encoder/miro_ego_sha256.c
            csrc/miro-ego-encoder/miro_ego_split.c
            csrc/miro-ego-encoder/miro_ego_mp4_meta.c
          )
          if [[ -n "${HB_SDK_ROOT:-}" && -z "${HOBOT_SDK_INCLUDE:-}" && -z "${HOBOT_SDK_LIB:-}" ]]; then
            HOBOT_SDK_INCLUDE="${HB_SDK_ROOT}/include"
            HOBOT_SDK_LIB="${HB_SDK_ROOT}/lib"
          fi
          if [[ -n "${HOBOT_SDK_INCLUDE:-}" && -n "${HOBOT_SDK_LIB:-}" && -f "${HOBOT_SDK_LIB}/libmultimedia.so" ]]; then
            echo "Linking miro-ego-encoder against RDK X5 Hobot SDK"
            zig cc -target aarch64-linux-gnu.2.28 -O2 -Wall -Wextra -Werror -std=gnu11 \
              -I"$HOBOT_SDK_INCLUDE" -Icsrc/miro-ego-encoder \
              "${SRCS[@]}" \
              -L"$HOBOT_SDK_LIB" -Wl,-rpath,/usr/hobot/lib -Wl,-rpath-link,"$HOBOT_SDK_LIB" \
              -lmultimedia -lpthread \
              -o dist-aarch64/miro-ego-encoder
            {
              echo "MIRO_EGO_MOCK_SDK=0"
              echo "MIRO_EGO_ARCHIVE_NAME=miro-ego-rdk-x5-bundle.tar"
              echo "MIRO_EGO_ARTIFACT_NAME=miro-ego-rdk-x5-${GITHUB_SHA}"
            } >> "$GITHUB_ENV"
          else
            if [[ "${GITHUB_REF_TYPE:-}" == "tag" || "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              echo "::error::Refusing to build release tag ${GITHUB_REF:-unknown} against mock_hobot_sdk.c: HB_SDK_ROOT (or HOBOT_SDK_INCLUDE and HOBOT_SDK_LIB/libmultimedia.so) is required for hardware release bundles." >&2
              exit 1
            fi
            if [[ -n "${HB_SDK_ROOT:-}" || -n "${HOBOT_SDK_INCLUDE:-}" || -n "${HOBOT_SDK_LIB:-}" ]]; then
              echo "::error::Partial or invalid Hobot SDK paths supplied (expected HB_SDK_ROOT or HOBOT_SDK_INCLUDE and HOBOT_SDK_LIB/libmultimedia.so)." >&2
              exit 1
            fi
            echo "Building non-release CI smoke miro-ego-encoder against mock_hobot_sdk.c (--allow-mock-encoder)"
            zig cc -target aarch64-linux-gnu.2.28 -O2 -Wall -Wextra -Werror -std=gnu11 \
              -Icsrc/miro-ego-encoder/tests/stubs -Icsrc/miro-ego-encoder -Icsrc/miro-ego-encoder/tests \
              "${SRCS[@]}" csrc/miro-ego-encoder/tests/mock_hobot_sdk.c \
              -lpthread \
              -o dist-aarch64/miro-ego-encoder
            {
              echo "MIRO_EGO_MOCK_SDK=1"
              echo "MIRO_EGO_ARCHIVE_NAME=rdk-x5-ci-mock-smoke-bundle.tar"
              echo "MIRO_EGO_ARTIFACT_NAME=rdk-x5-ci-mock-smoke-bundle"
            } >> "$GITHUB_ENV"
          fi

      - name: Verify AArch64 ELF64 binary headers
        run: |
          uv run --extra dev python - <<'PY'
          from pathlib import Path
          from scripts.build_rdk_x5_bundle import sha256_file, validate_aarch64_elf64

          for label, path in (
              ("bin/miro-ego", Path("target/aarch64-unknown-linux-gnu/release/miro-ego")),
              ("bin/miro-ego-encoder", Path("dist-aarch64/miro-ego-encoder")),
          ):
              size, digest, header = sha256_file(path)
              validate_aarch64_elf64(header, label)
              print(f"Verified AArch64 ELF64 {label}: {size} bytes, sha256={digest}")
          PY

      - name: Assemble pure-native RDK X5 bundle and archive
        env:
          MIRO_EGO_RELEASE_SIGNING_SEED_HEX: ${{ secrets.MIRO_EGO_RELEASE_SIGNING_SEED_HEX || '' }}
        run: |
          mkdir -p dist-rdk-x5
          signing_args=()
          if [[ -n "${MIRO_EGO_RELEASE_SIGNING_SEED_HEX}" ]]; then
            signing_args+=(--signing-seed-hex "${MIRO_EGO_RELEASE_SIGNING_SEED_HEX}")
          else
            unset MIRO_EGO_RELEASE_SIGNING_SEED_HEX
          fi
          bundle_args=()
          if [[ "${MIRO_EGO_MOCK_SDK}" == "1" ]]; then
            bundle_args+=(--allow-mock-encoder)
          fi
          uv run --extra dev python scripts/build_rdk_x5_bundle.py \
            --miro-ego-bin target/aarch64-unknown-linux-gnu/release/miro-ego \
            --encoder-bin dist-aarch64/miro-ego-encoder \
            --output dist-rdk-x5/bundle \
            --archive "dist-rdk-x5/${MIRO_EGO_ARCHIVE_NAME}" \
            --version "$MIRO_EGO_VERSION" \
            --commit "$MIRO_EGO_COMMIT" \
            "${bundle_args[@]}" \
            "${signing_args[@]}"
          if [[ "${MIRO_EGO_MOCK_SDK}" == "1" ]]; then
            cat > dist-rdk-x5/MOCK_SDK_WARNING.txt <<'EOF'
          CI SMOKE ARTIFACT ONLY (-mock-sdk)
          bin/miro-ego-encoder in this archive was linked against mock_hobot_sdk.c for CI packaging verification.
          Do NOT deploy this mock-sdk archive onto RDK X5 hardware; hardware release bundles require libmultimedia.so.
          EOF
          fi

      - name: Verify SHA256SUMS and host factory-recovery bundle contract
        run: |
          (cd dist-rdk-x5/bundle && sha256sum --check --strict SHA256SUMS)
          PYTHONPATH=tools uv run --extra dev python - <<'PY'
          import os
          from pathlib import Path
          from miro_ego_host.factory_recovery.provision import require_native_bundle

          archive = Path("dist-rdk-x5") / os.environ["MIRO_EGO_ARCHIVE_NAME"]
          require_native_bundle(archive)
          print(f"Host provision.require_native_bundle({archive}) verification PASSED")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MIRO_EGO_ARTIFACT_NAME }}
          path: dist-rdk-x5/
          if-no-files-found: error
          retention-days: 14
