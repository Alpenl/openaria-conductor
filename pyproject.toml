[project]
name = "miro-ego-host"
version = "0.3.0"
description = "Miro-Ego 0.3.0 host-PC utilities (factory recovery, exFAT card exporter, Spectacular calibration check) and repository verification scripts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
miro-ego-spectacular-check = "miro_ego_host.spectacular.check_cli:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.12,<1",
  "cryptography>=44,<48",
  "paramiko>=3.5,<5",
  "pyfatfs==1.1.0",
  # PyFilesystem still imports pkg_resources; keep its provider available.
  "setuptools==80.9.0",
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0,<7",
  "dissect.extfs==3.15",
  "dissect.volume==3.18",
  "dissect.cstruct==4.7",
  "dissect.util==3.24",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
where = ["tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
