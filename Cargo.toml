[workspace]
members = [
    "native",
    "crates/miro-ego-core",
    "crates/miro-ego-capture",
    "crates/miro-ego-storage",
    "crates/miro-ego-api",
    "crates/miro-ego-network",
    "crates/miro-ego-hw",
    "crates/miro-ego-deploy",
    "crates/miro-ego-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
jsonschema = { version = "0.50.0", default-features = false }
libc = "0.2.189"
libloading = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4", "v7"] }
miro-ego-core = { path = "crates/miro-ego-core" }
miro-ego-capture = { path = "crates/miro-ego-capture" }
miro-ego-storage = { path = "crates/miro-ego-storage" }
miro-ego-api = { path = "crates/miro-ego-api" }
miro-ego-network = { path = "crates/miro-ego-network" }
miro-ego-hw = { path = "crates/miro-ego-hw" }
miro-ego-deploy = { path = "crates/miro-ego-deploy" }
